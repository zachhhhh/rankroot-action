name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: rr
        uses: ./
        with:
          url: https://rankroot-ai.netlify.app
          min-score: 50
      - run: echo "score=${{ steps.rr.outputs.score }}"
